    study_channel: site-01-mgh
    alert_channel: site-01-mgh

people:         # demo address -> the study person's address in studies/<study>/study.yaml
  crc@demo.local: johnrohit94@gmail.com                    # study coordinator
  cra@demo.local: johnernest978@gmail.com                  # CRA
  sponsor@demo.local: peter+NCT05842941-sponsor@huma.ai    # sponsor (CRA and ClinOps lead)
  medmonitor@demo.local: john+medicalmonitor@huma.ai       # medical monitor
  pi@demo.local: eliot@huma.ai                             # principal investigator (Eliot's test role)
  eliot@demo.local: eliot@huma.ai
